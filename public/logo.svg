<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7E52" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C5B8" />
      <stop offset="100%" stop-color="#C2988B" />
    </linearGradient>
  </defs>

  <!-- Emblem Monogram: Stylized Z with sculpted botanical / nail silhouette -->
  <g transform="translate(15, 12)">
    <!-- Subtle outer ring -->
    <circle cx="48" cy="48" r="44" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
    <circle cx="48" cy="48" r="40" stroke="#241E1C" stroke-width="0.8" opacity="0.15"/>
    
    <!-- Stylized Z Monogram -->
    <path d="M 32 30 L 64 30 C 66 30 67 31 66 33 L 34 65 C 33 66 34 67 36 67 L 66 67" 
          stroke="#241E1C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Intersecting Rose Gold Petal Arc -->
    <path d="M 40 24 C 58 24 72 38 72 56 C 72 68 64 74 54 74 C 44 74 38 66 40 54" 
          stroke="url(#roseGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
          
    <!-- Subtle Star Sparkle -->
    <path d="M 64 26 Q 64 32 70 32 Q 64 32 64 38 Q 64 32 58 32 Q 64 32 64 26 Z" 
          fill="url(#goldGrad)"/>
  </g>

  <!-- Wordmark Text -->
  <!-- "ZARAH" -->
  <text x="135" y="60" 
        font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', Georgia, serif" 
        font-size="44" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#241E1C">ZARAH</text>

  <!-- Decorative Hairline Divider -->
  <line x1="138" y1="72" x2="480" y2="72" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8"/>
  <circle cx="309" cy="72" r="2.5" fill="#C5A880"/>

  <!-- Subtitle: "NAILS & BEAUTY" -->
  <text x="140" y="92" 
        font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12.5" 
        font-weight="500" 
        letter-spacing="7" 
        fill="#7A6B63">NAILS &amp; BEAUTY</text>

  <!-- Origin: "MASSEY • AUCKLAND" -->
  <text x="142" y="107" 
        font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="9" 
        font-weight="400" 
        letter-spacing="4.5" 
        fill="#A6948A">MASSEY • AUCKLAND</text>
</svg>
