<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#EBE2D5"/>
    </linearGradient>
    <filter id="softShadow7" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#241E1C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg7)"/>

  <!-- Aesthetic Botanical / Spa Bowl & Water Ripple -->
  <g transform="translate(100, 100)" filter="url(#softShadow7)">
    <circle cx="200" cy="200" r="180" fill="#E6D7CB" opacity="0.4"/>
    <circle cx="200" cy="200" r="150" fill="#F4EAE1" opacity="0.6"/>
    <circle cx="200" cy="200" r="120" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    
    <!-- Water ripples -->
    <ellipse cx="200" cy="210" rx="90" ry="30" stroke="#B89C8E" stroke-width="1.2" fill="none" opacity="0.5"/>
    <ellipse cx="200" cy="210" rx="60" ry="20" stroke="#B89C8E" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Botanical leaves -->
    <path d="M140,160 Q170,120 200,140 Q170,170 140,160 Z" fill="#8A9A86" opacity="0.7"/>
    <path d="M250,170 Q280,130 300,160 Q270,190 250,170 Z" fill="#9BAA97" opacity="0.6"/>

    <!-- Polished Toes / Foot Silhouette Symbol -->
    <path d="M170,220 C180,210 220,210 230,220 C240,240 230,280 200,280 C170,280 160,240 170,220 Z" 
          fill="#E8CEC4"/>
    <!-- Deep cherry polish dot -->
    <circle cx="185" cy="225" r="7" fill="#6A1B29"/>
    <circle cx="200" cy="223" r="6" fill="#6A1B29"/>
    <circle cx="213" cy="224" r="5" fill="#6A1B29"/>
  </g>

  <!-- Title Badge overlay -->
  <rect x="50" y="580" width="500" height="75" rx="12" fill="#FFFFFF" opacity="0.92" filter="url(#softShadow7)"/>
  <text x="80" y="614" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#241E1C">Restorative Spa Pedicure</text>
  <text x="80" y="636" font-family="sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#8C7A70">MINERAL SOAK, EXFOLIATION &amp; GEL</text>
  <text x="470" y="625" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#B58A7E" text-anchor="end">$65</text>
</svg>
