<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F3EE"/>
      <stop offset="100%" stop-color="#E9DFD3"/>
    </linearGradient>
    <filter id="softShadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#241E1C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg5)"/>
  
  <g filter="url(#softShadow5)" transform="translate(190, 110)">
    <!-- Base Nude nail -->
    <path d="M60,30 C110,30 150,75 150,190 L150,390 C150,410 70,410 70,390 L70,190 C70,75 60,30 60,30 Z" 
          fill="#EED9D1"/>
    <!-- Micro French tip in Espresso -->
    <path d="M60,30 C110,30 150,75 150,90 C125,70 85,70 60,90 Z" 
          fill="#2C1F1B"/>
    <!-- Fine gold line under micro tip -->
    <path d="M62,88 C85,68 125,68 148,88" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M85,60 Q115,130 120,300" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Title Badge overlay -->
  <rect x="50" y="580" width="500" height="75" rx="12" fill="#FFFFFF" opacity="0.92" filter="url(#softShadow5)"/>
  <text x="80" y="614" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#241E1C">Espresso Micro French</text>
  <text x="80" y="636" font-family="sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#8C7A70">DEEP CHOCOLATE &amp; GOLD PINSTRIPE</text>
  <text x="470" y="625" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#B58A7E" text-anchor="end">$55</text>
</svg>
