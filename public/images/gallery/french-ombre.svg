<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EE"/>
      <stop offset="100%" stop-color="#EBE3D8"/>
    </linearGradient>
    <linearGradient id="ombre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FDF9F7"/>
      <stop offset="50%" stop-color="#F2D8D1"/>
      <stop offset="85%" stop-color="#E6BDB1"/>
      <stop offset="100%" stop-color="#D9A99C"/>
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#241E1C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg2)"/>
  <circle cx="120" cy="150" r="120" fill="#EFE8DE" opacity="0.6"/>
  <path d="M100,500 Q300,300 550,550" fill="none" stroke="#DDCFC2" stroke-width="2" opacity="0.5"/>

  <g filter="url(#softShadow2)" transform="translate(190, 110)">
    <!-- Almond French Ombre shape -->
    <path d="M60,30 C110,30 150,75 150,190 L150,390 C150,410 70,410 70,390 L70,190 C70,75 60,30 60,30 Z" 
          fill="url(#ombre)"/>
    <path d="M75,375 C95,395 125,395 145,375" fill="none" stroke="#C49B8E" stroke-width="2" opacity="0.6"/>
    <!-- Highlight -->
    <path d="M90,60 Q120,130 125,300" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Title Badge overlay -->
  <rect x="50" y="580" width="500" height="75" rx="12" fill="#FFFFFF" opacity="0.92" filter="url(#softShadow2)"/>
  <text x="80" y="614" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#241E1C">Rose French Ombre</text>
  <text x="80" y="636" font-family="sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#8C7A70">BABY BOOMER &amp; GLOSS TOPCOAT</text>
  <text x="470" y="625" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#B58A7E" text-anchor="end">$85</text>
</svg>
