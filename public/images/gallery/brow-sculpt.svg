<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F6"/>
      <stop offset="100%" stop-color="#ECE3D7"/>
    </linearGradient>
    <filter id="softShadow8" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#241E1C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg8)"/>

  <!-- Aesthetic Brow Curve & Thread Line Art -->
  <g transform="translate(100, 100)" filter="url(#softShadow8)">
    <circle cx="200" cy="200" r="160" fill="#F2E6DC" opacity="0.6"/>
    
    <!-- Precision Threading Crossed Lines -->
    <line x1="80" y1="280" x2="320" y2="120" stroke="#C5A880" stroke-width="1.8" opacity="0.7"/>
    <line x1="80" y1="120" x2="320" y2="280" stroke="#C5A880" stroke-width="1.8" opacity="0.7"/>

    <!-- Beautifully sculpted eyebrow arch -->
    <path d="M100,210 Q190,140 270,180 Q300,200 320,230 Q270,200 190,165 Q130,195 100,210 Z" 
          fill="#3E2B25"/>
          
    <!-- Subtle skin glow tone -->
    <ellipse cx="200" cy="220" rx="90" ry="30" fill="#E8D1C7" opacity="0.4"/>
  </g>

  <!-- Title Badge overlay -->
  <rect x="50" y="580" width="500" height="75" rx="12" fill="#FFFFFF" opacity="0.92" filter="url(#softShadow8)"/>
  <text x="80" y="614" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#241E1C">Brow Architecture &amp; Tint</text>
  <text x="80" y="636" font-family="sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#8C7A70">PRECISION THREADING &amp; BESPOKE TINT</text>
  <text x="470" y="625" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#B58A7E" text-anchor="end">$30</text>
</svg>
