<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#ECE5DC"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5EBE6"/>
      <stop offset="70%" stop-color="#EAD9D5"/>
      <stop offset="100%" stop-color="#D9C2BA"/>
    </linearGradient>
    <linearGradient id="chromeGlow" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="45%" stop-color="rgba(230,210,225,0.4)"/>
      <stop offset="75%" stop-color="rgba(212,175,55,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#241E1C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bg)"/>
  
  <!-- Subtle aesthetic background curves -->
  <path d="M-50,200 Q200,100 450,350 T800,600" fill="none" stroke="#E2D7CC" stroke-width="1.5" opacity="0.6"/>
  <circle cx="500" cy="180" r="140" fill="#EFE8E0" opacity="0.5"/>

  <!-- Main Nail Hand / Nail Tip Composition -->
  <g filter="url(#softShadow)" transform="translate(180, 110)">
    <!-- Nail 1 (Almond center) -->
    <path d="M70,30 C120,30 160,80 160,200 L160,400 C160,420 80,420 80,400 L80,200 C80,80 70,30 70,30 Z" 
          fill="url(#pearl)"/>
    <path d="M70,30 C120,30 160,80 160,200 L160,400 C160,420 80,420 80,400 L80,200 C80,80 70,30 70,30 Z" 
          fill="url(#chromeGlow)"/>

    <!-- Cuticle crescent -->
    <path d="M85,385 C105,405 135,405 155,385" fill="none" stroke="#D1BEB5" stroke-width="2.5" opacity="0.7"/>

    <!-- Light reflection highlight streak -->
    <path d="M100,70 Q130,140 135,320" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M92,90 Q110,130 115,240" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Sparkles -->
    <path d="M145,90 Q145,100 155,100 Q145,100 145,110 Q145,100 135,100 Q145,100 145,90 Z" fill="#D4AF37"/>
    <path d="M80,180 Q80,188 88,188 Q80,188 80,196 Q80,188 72,188 Q80,188 80,180 Z" fill="#D4AF37" opacity="0.8"/>
  </g>

  <!-- Title Badge overlay -->
  <rect x="50" y="580" width="500" height="75" rx="12" fill="#FFFFFF" opacity="0.92" filter="url(#softShadow)"/>
  <text x="80" y="614" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#241E1C">Glazed Pearlescent Chrome</text>
  <text x="80" y="636" font-family="sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#8C7A70">SIGNATURE BIAB &amp; MIRROR POWDER</text>
  <text x="470" y="625" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#B58A7E" text-anchor="end">$60</text>
</svg>
